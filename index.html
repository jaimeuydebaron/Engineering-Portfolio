<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, Jaime</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,200,255,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 1rem;
      animation: fadeUp 1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 14rem);
      line-height: 0.9;
      color: #fff;
      letter-spacing: 0.02em;
      text-shadow:
        0 0 80px rgba(99,200,255,0.25),
        0 0 160px rgba(99,200,255,0.1);
      animation: fadeUp 1s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 span {
      color: #63C8FF;
    }

    .line {
      width: 40px;
      height: 2px;
      background: #63C8FF;
      margin: 1.5rem auto 0;
      animation: expand 1s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes expand {
      from { width: 0; opacity: 0; }
      to   { width: 40px; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="container">
    <p class="label">Welcome</p>
    <h1>Hello, <span>Jaime</span></h1>
    <div class="line"></div>
  </div>
</body>
</html>
